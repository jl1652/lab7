<!DOCTYPE html>
<html>
<head>
    <title>Full Screen Leaflet Map</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"/>
    <link rel="stylesheet" href="Style.css">

</head>
<body>
    <div id="map"></div>

    <div class="dropdown">
      <button class="dropbtn">Pages</button>
      <div class="dropdown-content">
        <a href="https://jl1652.github.io/lab7/dynamic_layers.html" target="_blank" rel="noopener noreferrer">Dynamic Layers</a>
        <a href="https://jl1652.github.io/lab7/on_event.html" target="_blank" rel="noopener noreferrer">On Event</a>
        <a href="https://jl1652.github.io/lab7/simple_mapping.html" target="_blank" rel="noopener noreferrer">Simple Mapping</a>
        <a href="https://jl1652.github.io/lab7/tile_layer.html" target="_blank" rel="noopener noreferrer">Tile Layer</a>
        <a href="https://jl1652.github.io/lab7/basemap_gallery.html" target="_blank" rel="noopener noreferrer">Basemap Gallery</a>
        <a href="https://jl1652.github.io/lab7/query_task.html" target="_blank" rel="noopener noreferrer">Query Task</a>
      </div>
    </div>


    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script>

    var map = L.map('map').setView([20, 0], 2);   // world view, since entrants are global

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri'
}).addTo(map);

var bigfoot = L.esri.featureLayer({
  url: 'https://services.arcgis.com/V6ZHFr6zdgNZuVG0/ArcGIS/rest/services/2016BigfootEntrants/FeatureServer/0',
  pointToLayer: function (geojson, latlng) {
    return L.circleMarker(latlng, {
      radius: 5,
      color: '#fff',
      weight: 1,
      fillColor: '#6b3e1e',
      fillOpacity: 0.85
    });
  }
}).addTo(map);

bigfoot.bindPopup(function (layer) {
  var p = layer.feature.properties;
  return '<strong>' + p.First + ' ' + p.Last + '</strong><br>' +
         p.City + ', ' + p.Country + '<br>' +
         'Place: ' + p.Place + '<br>' +
         'Age: ' + p.Age + ' (' + p.Gender + ')<br>' +
         'Time: ' + p.Time;
});
     </script>
</body>
</html>
